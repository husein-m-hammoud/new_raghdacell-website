<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" tyap="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e2304b" />

    <meta name="description" content="توفر شحن جميع التطبيقات والالعاب أون لاين عبر الايدي 
    شحن تطبيقات العاب اون لاين بأسهل الطرق" />
    <title></title>
</head>

<body>
    <div id="root"></div>
</body>
<script>
    (function() {
        const stored = localStorage.getItem("website_info_data");
        if (stored) {
            try {
                const parsed = JSON.parse(stored).websiteInfo;

                if (parsed.primary_color) {
                    document.documentElement.style.setProperty("--primary-color", parsed.primary_color);
                }
                if (parsed.secondary_color) {
                    document.documentElement.style.setProperty("--secondary-color", parsed.secondary_color);
                }
                if (parsed.body_bg_image) {
                    document.body.style.backgroundImage = `url('${parsed.body_bg_image}')`;
                    document.body.style.backgroundSize = "contain";
                    document.body.style.backgroundRepeat = "no-repeat";
                    document.body.style.backgroundPosition = "center";


                }
                if (parsed.footer_bg_image) {
                    const footer = document.querySelector("footer");
                    if (footer) {
                        footer.style.backgroundImage = `url('${parsed.footer_bg_image}')`;
                        footer.style.backgroundSize = "contain";
                        footer.style.backgroundRepeat = "no-repeat";
                        footer.style.backgroundPosition = "center";

                    }
                }
                if (parsed.logo_url) {
                    const logos = document.getElementsByClassName("site-logo");
                    Array.from(logos).forEach((el) => {
                        el.src = parsed.logo_url;
                        if (parsed.logo_width && el.classList.contains("header-logo")) {
                            el.style.width = parsed.logo_width;
                        }
                        if (parsed.logo_mobile_width && el.classList.contains("mobile-logo")) {
                            el.style.width = parsed.logo_mobile_width;
                        }
                    });
                }

                if (parsed.icon_url) {
                    let link =
                        document.querySelector("link[rel='icon']") ||
                        document.createElement("link");

                    link.rel = "icon";
                    link.href = parsed.icon_url;
                    document.head.appendChild(link);
                }
                if (parsed.website_name) {
                    document.title = parsed.website_name;
                }

            } catch (e) {}
        }
    })();
</script>

</html>
